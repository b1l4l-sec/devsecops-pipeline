name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: devsecops-app
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ─────────────────────────────────────────
  # JOB 1: Code Quality & Security Scan
  # ─────────────────────────────────────────
  code-security:
    name: Code Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          pip install pytest pytest-flask
          PYTHONPATH=. pytest tests/ -v

      - name: Scan code for secrets (Trivy fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '0'

  # ─────────────────────────────────────────
  # JOB 2: Build Docker Image
  # ─────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: code-security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} ./app
          docker tag ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} ${{ env.APP_NAME }}:latest

      - name: Save image as artifact
        run: |
          docker save ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 3: Container Vulnerability Scan
  # ─────────────────────────────────────────
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < image.tar.gz

      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          severity: 'HIGH,CRITICAL'
          format: 'table'
          trivyignores: '.trivyignore'
          exit-code: '1'

  # ─────────────────────────────────────────
  # JOB 4: Deploy
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < image.tar.gz

      - name: Deploy container
        run: |
          docker stop ${{ env.APP_NAME }}-production 2>/dev/null || true
          docker rm ${{ env.APP_NAME }}-production 2>/dev/null || true

          docker run -d \
            --name ${{ env.APP_NAME }}-production \
            --restart unless-stopped \
            -p 5000:5000 \
            -e APP_VERSION=${{ env.IMAGE_TAG }} \
            -e ENVIRONMENT=production \
            ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify deployment
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
          echo "✅ Deployment successful!"

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Live" >> $GITHUB_STEP_SUMMARY
